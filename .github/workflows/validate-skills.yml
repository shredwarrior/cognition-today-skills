name: validate-skills

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  structural-validation:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate skill packages
        run: python tools/validate_skills.py

  link-check:
    name: Source link check
    runs-on: ubuntu-latest
    # Advisory only. A Cognition Today outage or a transient block must not fail
    # a code change, but a permanently dead source URL needs to be noticed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check that every cited source URL resolves
        shell: bash
        run: |
          set -uo pipefail
          urls=$(grep -rhoE 'https://cognitiontoday\.com[A-Za-z0-9._/#-]*' \
                   skills/ README.md CITATION.cff \
                 | sed 's/[.,)]*$//' | sort -u)
          status=0
          while read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::warning::$url returned $code"
              status=1
            else
              echo "ok $url"
            fi
          done <<< "$urls"
          exit $status
